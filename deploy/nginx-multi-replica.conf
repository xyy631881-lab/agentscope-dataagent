# =============================================================================
# 多副本本地验证用 Nginx 配置（粘性会话 = ip_hash）
#
# 用法（Windows）:
#   nginx.exe -c deploy\nginx-multi-replica.conf
# 用法（Linux / Git Bash）:
#   nginx -c $(pwd)/deploy/nginx-multi-replica.conf
#
# 前置：先按下面的步骤启动 2 个 app 副本（8080 / 8081），再启动本 Nginx。
#       浏览器访问 http://localhost 即可，请求会被按客户端 IP 固定到某一副本。
# =============================================================================

# 两个 app 副本组成的上游集群
upstream dataagent_backend {
    # ip_hash = 粘性会话：同一客户端 IP 始终落到同一个副本。
    # 这样本 Pod 的 Docker 沙箱与进程内状态不会被"跨 Pod 打散"。
    # 注意：ip_hash 按 IP 粘性，不能和 weight/least_conn 混用。
    ip_hash;

    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    # 加第 3 副本：再起一个进程监听 8082，并加一行 server 127.0.0.1:8082 ...
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://dataagent_backend;

        # 透传真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应（对话）需要：关缓冲 + 长超时 + HTTP/1.1 长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
