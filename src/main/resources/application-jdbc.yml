# ---------------------------------------------------------------------------
# Spring profile: jdbc
#
# Activate with `--spring.profiles.active=jdbc` (or `SPRING_PROFILES_ACTIVE=jdbc`)
# to flip the default DataSource from embedded H2 over to an external RDBMS
# (MySQL by default, PostgreSQL via env vars).
#
# Operators can also set the DATAAGENT_DB_* env vars directly on the base
# (no-profile) configuration without activating this profile — the
# distinction is that this profile changes the *defaults* to MySQL-shaped
# values so a bare `--spring.profiles.active=jdbc` is enough to point at a
# local MySQL.
#
# The MySQL ( com.mysql:mysql-connector-j ) and PostgreSQL ( org.postgresql:postgresql )
# JDBC drivers are bundled at runtime scope; Hibernate auto-detects the
# dialect from the JDBC URL.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${DATAAGENT_DB_URL:jdbc:mysql://localhost:3306/agentscope_dataagent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC}
    username: ${DATAAGENT_DB_USER:agentscope}
    password: ${DATAAGENT_DB_PASSWORD:agentscope}
    driver-class-name: ${DATAAGENT_DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      # 'update' 方便开发；生产部署应通过 Flyway/Liquibase 固定 schema 并切换为 'validate'。
      ddl-auto: ${DATAAGENT_JPA_DDL_AUTO:update}

  # 在 MySQL/PostgreSQL 上禁用仅 H2 可用的 `data-h2.sql` 种子脚本。
  # 演示账号（bob, alice）仅用于本地开发便利，不应出现在生产数据库中。
  sql:
    init:
      mode: never

# ---------------------------------------------------------------------------
# PostgreSQL 覆盖示例（环境变量同样有效）：
#
#   DATAAGENT_DB_URL=jdbc:postgresql://localhost:5432/agentscope_dataagent
#   DATAAGENT_DB_DRIVER=org.postgresql.Driver
#   DATAAGENT_DB_USER=agentscope
#   DATAAGENT_DB_PASSWORD=agentscope
# ---------------------------------------------------------------------------
