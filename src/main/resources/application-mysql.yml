# ========================================================================
# Profile: mysql — MySQL 数据源
# 启动: --spring.profiles.active=dev,mysql (开发连 MySQL)
#       --spring.profiles.active=prod,mysql,redis (生产全栈)
# ========================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agentscope_dataagent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:root}
    hikari:
      pool-name: DataAgentPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
  sql:
    init:
      mode: never   # MySQL 不跑 H2 种子脚本
