server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agentscope-dataagent
  profiles:
    default: dev    # 默认 dev profile；生产设 SPRING_PROFILES_ACTIVE=prod,mysql,redis
  jpa:
    open-in-view: false  # 关掉懒加载（WebFlux 必须关）
    hibernate:
      ddl-auto: validate          # 生产默认；dev profile 覆写为 update
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true

# ========================================================================
# 日志
# ========================================================================
logging:
  level:
    root: INFO
    io.agentscope: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

# ========================================================================
# Actuator 监控
# ========================================================================
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      show-details: never

# ========================================================================
# DataAgent 公共配置
# ========================================================================
dataagent:
  jwt:
    secret: ${DATAAGENT_JWT_SECRET:dataagent-default-dev-secret-change-in-production-32chars}   # 32 字符；生产必设
    expire:
      access-token: 30m  # 登录 30 分钟过期
      refresh-token: 7d  # 刷新令牌 7 天
    issuer: dataagent
    header: Authorization
    prefix: Bearer

  workspace:
    root: ${DATAAGENT_WORKSPACE:}
    auto-create: true

  storage:
    type: local
    local:
      max-file-size: 10MB

  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: https://dashscope.aliyuncs.com
    model:
      chat: ${DATAAGENT_MODEL_NAME:qwen-max}
    stream:
      enabled: true

  agent:
    name: ${DATAAGENT_AGENT_NAME:data-agent}
    description: 基于 AgentScope 2.0 的企业数据分析助手
    max-history-rounds: 20
    enable-memory: true  # 上下文记忆
    enable-tool-cache: true  # 工具调用结果缓存
    enable-stream: true
    system-prompt: classpath:/prompts/system.md  # ↑ 这一行是关键：提示词不在 yaml 里，指向了一个独立文件

  marketplace:
    enabled: true
    contribution:
      max-size: 1MB
      max-count: 50
    cache:
      enabled: true
      ttl: 1h

  session:
    provider:
      type: memory  # 会话存在内存里
    memory:
      expire: 30m
    redis:
      enabled: false  # Redis 默认关闭，redis profile 打开
      ttl: 30m
      key-prefix: "dataagent:session:"
