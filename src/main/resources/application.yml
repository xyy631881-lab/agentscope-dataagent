server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agentscope-dataagent
  profiles:
    default: mysql,redis    # 默认启用 mysql + redis profile：MySQL 数据源 + Redis 分布式 AgentStateStore
  jpa:
    open-in-view: false  # 关掉懒加载（避免 Controller 层意外触发 N+1 查询）
    hibernate:
      ddl-auto: validate          # 主配置默认 validate；mysql profile 覆写为 update
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true

# ========================================================================
# 日志
# ========================================================================
logging:
  level:
    root: INFO
    io.agentscope: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

# ========================================================================
# Actuator 监控
# ========================================================================
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      show-details: never

# ========================================================================
# DataAgent 公共配置
# ========================================================================
dataagent:
  jwt:
    secret: ${DATAAGENT_JWT_SECRET:dataagent-default-dev-secret-change-in-production-32chars}   # 32 字符；生产必设
    expire:
      access-token: 30m  # 登录 30 分钟过期
      refresh-token: 7d  # 刷新令牌 7 天
    issuer: dataagent
    header: Authorization
    prefix: Bearer

  workspace:
    root: ${DATAAGENT_WORKSPACE:}
    auto-create: true

  storage:
    type: local
    local:
      max-file-size: 10MB

  ollama:
    # Ollama 服务地址
    base-url: http://localhost:11434
    model:
      # Ollama 中已拉取的模型名称
      chat: ${DATAAGENT_MODEL_NAME:qwen2.5:1.5b}

  # 模型选择：本地 Ollama 与 LongCat API 二选一作为全局默认；
  # 也可在管理台按 Agent 单独指定 model 字段（local / longcat）。
  model:
    active: ${DATAAGENT_MODEL_ACTIVE:longcat}    # ollama(本地) | longcat(API)
    longcat:
      api-key: ${LONGCAT_API_KEY:ak_2NX5nj7y16ja2Y91Dt4oe06V89q1u}             # LongCat API Key，建议用环境变量注入
      model-name: ${LONGCAT_MODEL:LongCat-2.0}
      base-url: ${LONGCAT_BASE_URL:https://api.longcat.chat/openai}

  agent:
    name: ${DATAAGENT_AGENT_NAME:data-agent}
    description: 基于 AgentScope 2.0 的企业数据分析助手
    max-history-rounds: 20
    enable-memory: true  # 上下文记忆
    enable-tool-cache: true  # 工具调用结果缓存
    enable-stream: true
    system-prompt: classpath:/prompts/system.md  # ↑ 这一行是关键：提示词不在 yaml 里，指向了一个独立文件

  marketplace:
    enabled: true
    contribution:
      max-size: 1MB
      max-count: 50
    cache:
      enabled: true
      ttl: 1h

  session:
    provider:
      type: memory  # 会话存在内存里
    memory:
      expire: 30m
    redis:
      enabled: false  # Redis 默认关闭，redis profile 打开
      ttl: 30m
      key-prefix: "dataagent:session:"

  sandbox:
    # 沙箱工作区快照后端（与 StateStoreConfig 的状态后端配对，彻底消除"重启丢沙箱"）
    # - 默认（启用 redis profile 即 dataagent.session.redis.enabled=true）→ RedisSnapshotSpec：开箱即用
    # - 未启用 redis → Noop：单副本、保留容器策略（应用关闭 stop() 保留容器于宿主机）
    # - 可选 JDBC 快照：需引入 agentscope-extensions-mysql 并补一个 JdbcSnapshotSpec(dataSource) Bean，
    #   本离线构建环境未含该扩展，故默认关闭
    snapshot:
      jdbc:
        enabled: false  # JDBC 快照开关（需 mysql 扩展；与 redis 快照互斥，优先级低于 redis）
