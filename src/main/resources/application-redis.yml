# ========================================================================
# Profile: redis — Redis Session 共享（多副本必需）
# 启动: --spring.profiles.active=dev,mysql,redis
# ========================================================================
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 2
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

dataagent:
  runtime:
    redis:
      enabled: true
