# ========================================================================
# Profile: dev — 开发环境默认（spring.profiles.default=dev）
# H2 数据库 + 详细日志 + schema 自动更新
# ========================================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${user.home}/.agentscope-dataagent/db;AUTO_SERVER=TRUE;MODE=MYSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  sql:
    init:
      mode: always
      platform: h2
      continue-on-error: false

logging:
  level:
    io.agentscope: DEBUG
    org.hibernate.SQL: WARN
